# See https://github.com/Tecnativa/doodba#optodoocustomsrcreposyaml
./odoo:
  defaults:
    # Shallow repositories ($DEPTH_DEFAULT=1) are faster & thinner
    # You may need a bigger depth when merging PRs (use 5000
    # for a sane value of 100 commits)
    depth: 5000
  remotes:
    ocb: https://github.com/OCA/OCB.git
    odoo: https://github.com/odoo/odoo.git
    openupgrade: https://github.com/OCA/OpenUpgrade.git
    escodoo: https://github.com/Escodoo/OCB.git
  target: ocb $ODOO_VERSION
  merges:
    # - ocb $ODOO_VERSION
    - escodoo 14.0-hack-website_slides # WEBSITE_SLIDES REMOVE PT_BR TRANSLATIONS
    # - escodoo refs/pull/2/head # ACCOUNT SET PASS IN MODEL (PROCESS MIGRATION SCRIPT)

account-financial-reporting:
  defaults:
    depth: $DEPTH_MERGE
  remotes:
    origin: https://github.com/OCA/account-financial-reporting
  merges:
    - origin $ODOO_VERSION
    - origin refs/pull/1165/head # Escodoo:14.0-account_financial_report-imp-general-ledger-account-range
  target: origin merged
  fetch_all: true

account-reconcile:
  defaults:
    depth: $DEPTH_MERGE
  remotes:
    origin: https://github.com/OCA/account-reconcile
    escodoo: https://github.com/Escodoo/account-reconcile
  merges:
    - origin $ODOO_VERSION
    # - origin refs/pull/459/head # Tecnativa:14.0-account_reconciliation_widget-in_payment
    - escodoo 14.0-account_reconcilation_widget-in_payment-escodoo
  target: origin merged
  fetch_all: true

timesheet:
  defaults:
    depth: $DEPTH_MERGE
  remotes:
    origin: https://github.com/OCA/timesheet
    escodoo: https://github.com/Escodoo/timesheet
  merges:
    - origin $ODOO_VERSION
    - origin refs/pull/628/head # HR_TIMESHEET_SHEET_NO_CRETATE
  target: origin merged
  fetch_all: true

l10n-brazil:
  defaults:
    depth: 2000
  remotes:
    origin: https://github.com/OCA/l10n-brazil
    escodoo: https://github.com/Escodoo/l10n-brazil
  merges:
    - origin $ODOO_VERSION
    - origin refs/pull/2429/head # L10N_BR_HR_CONTRACT
    - origin refs/pull/3076/head # fix fiscal_documento_line
    # - escodoo refs/pull/57/head # REMOVE DUPLICATE CSV LINES IN L10N BR FISCAL (PROCESS MIGRATION SCRIPT)
  target: origin merged
  fetch_all: true

odoo-usability:
  defaults:
    depth: $DEPTH_MERGE
  remotes:
    origin: https://github.com/Akretion/odoo-usability
    escodoo: https://github.com/Escodoo/odoo-usability
  merges:
    - origin $ODOO_VERSION
    # - escodoo refs/pull/1/head # ACCOUNT_USABILITY REMOVE SCRIPT MIGRATION TO IGNORE CONFLICT (PROCESS MIGRATION SCRIPT)
    # - escodoo refs/pull/2/head # PRODUCT_USABILITY SCRIPT TO REMOVE PRODUCT_REL NOT FOUND IN PRODUCT AND PRODUCT_TEMPLATE (PROCESS MIGRATION SCRIPT)
    - escodoo refs/pull/3/head # SALE_USABILITY DISABLE ERROR CLIENT_ORDER_REF
  target: escodoo merged
  fetch_all: true
 
bank-payment:
  defaults:
    depth: $DEPTH_MERGE
  remotes:
    origin: https://github.com/OCA/bank-payment
    escodoo: https://github.com/Escodoo/bank-payment
  merges:
    - origin $ODOO_VERSION
    - origin refs/pull/1253/head # Escodoo:14.0-add-account_payment_order_restriction_account_move
  target: escodoo merged
  fetch_all: true  

account-move-import:
 defaults:
   depth: $DEPTH_MERGE
 remotes:
   origin: https://github.com/akretion/account-move-import
   escodoo: https://github.com/Escodoo/account-move-import
 merges:
   - origin $ODOO_VERSION
   - escodoo 14.0-imp-account_move_csv_import # date_maturity in CSV and XLSX
 target: escodoo merged
 fetch_all: true

stock-logistics-warehouse:
 defaults:
   depth: $DEPTH_MERGE
 remotes:
   origin: https://github.com/oca/stock-logistics-warehouse
   escodoo: https://github.com/Escodoo/stock-logistics-warehouse
 merges:
   - origin $ODOO_VERSION
   - origin refs/pull/2095/head # FIX compute_state in SRO module stock_request related tier.validation
 target: escodoo merged
 fetch_all: true
