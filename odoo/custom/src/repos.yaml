    depth: $DEPTH_MERGE
  remotes:
    origin: https://github.com/OCA/account-financial-tools
  merges:
    - origin $ODOO_VERSION
    - origin refs/pull/1802/head # Escodoo:14.0-add-account_asset_management_fleet
